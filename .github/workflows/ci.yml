name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dank1801-msc-portal-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check
