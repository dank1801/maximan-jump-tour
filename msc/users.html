<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSC Portal - Benutzer</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="portal-container">
        <div class="portal-sidebar">
            <div class="portal-logo">MSC Portal</div>
            <ul class="portal-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="users.html" class="active">Benutzer & Rollen</a></li>
                <li><a href="teams.html">Teams & Lizenzen</a></li>
                <li><a href="events.html">Wettkämpfe</a></li>
                <li><a href="points.html">Punkte & Wertungen</a></li>
                <li><a href="transfers.html">Transfers & Verträge</a></li>
                <li><a href="reporting.html">Reporting & Audit</a></li>
                <li><a href="settings.html">Einstellungen</a></li>
            </ul>
        </div>

        <div class="portal-main">
            <div class="portal-header">
                <h1>Benutzer & Rollen</h1>
                <div class="portal-user-info">
                    <div>
                        <div class="user-badge" data-session-user>Admin</div>
                        <div style="font-size: 12px; color: var(--gray); margin-top: 4px;" data-session-role>Admin</div>
                    </div>
                    <button id="logout-button" class="btn btn-secondary btn-small">Abmelden</button>
                </div>
            </div>

            <div class="portal-content">
                <div class="card">
                    <div class="card-header">
                        <h2>Neuen Benutzer erstellen</h2>
                    </div>
                    <div class="card-body">
                        <form id="create-user-form" class="grid-2">
                            <div class="form-group">
                                <label>Benutzerkennung</label>
                                <input type="text" name="username" required />
                            </div>
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" name="name" required />
                            </div>
                            <div class="form-group">
                                <label>E-Mail</label>
                                <input type="email" name="email" required />
                            </div>
                            <div class="form-group">
                                <label>Rolle</label>
                                <select name="role" required>
                                    <option value="msc_admin">MSC Admin</option>
                                    <option value="teammanager">Teammanager</option>
                                    <option value="jury">Jury</option>
                                    <option value="lizenzstelle">Lizenzstelle</option>
                                    <option value="reporter">Reporter</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Passwort</label>
                                <input type="password" name="password" required />
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select name="status" required>
                                    <option value="active">Aktiv</option>
                                    <option value="inactive">Inaktiv</option>
                                </select>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Benutzer erstellen</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Benutzer</h2>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>E-Mail</th>
                                    <th>Rolle</th>
                                    <th>Status</th>
                                    <th>Aktion</th>
                                </tr>
                            </thead>
                            <tbody id="users-list-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="portal.js"></script>
    <script>
        if (!isLoginPage()) {
            document.getElementById("create-user-form")?.addEventListener("submit", async (e) => {
                e.preventDefault();
                const data = getFormData(document.getElementById("create-user-form"));
                try {
                    await api("/users", { method: "POST", body: JSON.stringify(data) });
                    showToast("Benutzer erstellt", "success");
                    loadUsers();
                } catch (error) {
                    showToast(error.message, "error");
                }
            });
            
            document.addEventListener("DOMContentLoaded", loadUsers);
        }
    </script>
</body>
</html>
