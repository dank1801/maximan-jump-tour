<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSC Portal - Anmelden</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>MSC Portal</h1>
            <p class="subtitle">Maximanischer Sport Club - Administrative Platform</p>

            <div id="login-message"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label>Benutzerkennung</label>
                    <input type="text" name="username" placeholder="z.B. admin" required />
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" name="password" placeholder="••••••••" required />
                </div>

                <div class="form-actions" style="margin-top: 25px;">
                    <button type="submit" class="btn btn-primary">Anmelden</button>
                </div>

                <div class="help-text" style="text-align: center; margin-top: 15px;">
                    Passwort vergessen? Kontaktiere einen Admin.
                </div>
            </form>

            <!-- Bootstrap Form -->
            <div id="bootstrap-section" class="hidden">
                <div class="form-divider">Erst-Setup</div>

                <form id="bootstrap-form">
                    <h2 style="font-size: 16px; color: var(--primary); margin-bottom: 15px;">Ersten Admin erstellen</h2>
                    <p style="color: var(--gray); margin-bottom: 20px; font-size: 13px;">
                        Es gibt noch keinen Admin. Lege jetzt den ersten MSC-Admin an.
                    </p>

                    <div class="form-group">
                        <label>Benutzerkennung</label>
                        <input type="text" name="username" placeholder="z.B. admin" required />
                        <div class="help-text">Nur Buchstaben, Zahlen und Unterstriche</div>
                    </div>

                    <div class="form-group">
                        <label>Vollständiger Name</label>
                        <input type="text" name="name" placeholder="z.B. Admin User" required />
                    </div>

                    <div class="form-group">
                        <label>E-Mail</label>
                        <input type="email" name="email" placeholder="admin@example.com" required />
                    </div>

                    <div class="form-group">
                        <label>Passwort</label>
                        <input type="password" name="password" placeholder="••••••••" required />
                        <div class="help-text">Mindestens 8 Zeichen</div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Admin erstellen</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="portal.js"></script>
</body>
</html>
