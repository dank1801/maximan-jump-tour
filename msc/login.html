<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSC Portal – Login</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-card">
            <span class="portal-badge">MSC Portal</span>
            <h1>Maximanischer Sport Club</h1>
            <p>Zentraler Zugang zu Benutzern, Teams, Wettkämpfen, Punkten, Transfers, Reporting und Einstellungen.</p>

            <div class="stack">
                <div class="field">
                    <label for="login-username">Benutzerkennung</label>
                    <input id="login-username" type="text" placeholder="msc.admin" autocomplete="username">
                </div>
                <div class="field">
                    <label for="login-password">Passwort</label>
                    <input id="login-password" type="password" placeholder="portal-2026" autocomplete="current-password">
                </div>
                <button id="login-button" class="btn-primary">Anmelden</button>
            </div>

            <div id="login-message" class="login-note hidden"></div>
            <div class="login-note">
                Demo-Zugang: <strong>msc.admin</strong> / <strong>portal-2026</strong>
            </div>
            <div class="login-links">
                <span>Passwort vergessen? Später im Backend-Flow.</span>
                <a href="../index.html">Zur öffentlichen Seite</a>
            </div>
        </section>
    </main>
    <script src="portal.js"></script>
</body>
</html>
