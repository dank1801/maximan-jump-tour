<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSC Portal – Login</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-card">
            <span class="portal-badge">MSC Portal</span>
            <h1>Portal Login</h1>
            <p>Ohne vordefinierte Daten. Zugang und Inhalte konfigurierst du selbst.</p>
            <div class="stack">
                <div class="field">
                    <label for="login-username">Benutzerkennung</label>
                    <input id="login-username" type="text" autocomplete="username">
                </div>
                <div class="field">
                    <label for="login-password">Passwort</label>
                    <input id="login-password" type="password" autocomplete="current-password">
                </div>
                <div class="field">
                    <label for="login-role">Rolle</label>
                    <input id="login-role" type="text" placeholder="Optional">
                </div>
                <button id="login-button" class="btn-primary">Anmelden</button>
            </div>
            <div id="login-message" class="login-note hidden"></div>
            <div class="login-links">
                <span>Passwort-Reset folgt später mit Backend.</span>
                <a href="../index.html">Zur Website</a>
            </div>
        </section>
    </main>
    <script src="portal.js"></script>
</body>
</html>
