<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MSC Portal Login</title>

<style>
body {
    background: #0a0f2c;
    font-family: Arial, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-box {
    background: #11163a;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    width: 350px;
}

.login-box h2 {
    margin-top: 0;
    text-align: center;
    margin-bottom: 25px;
}

.login-box label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
}

.login-box input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    margin-bottom: 15px;
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #0055ff;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
}

.login-box button:hover {
    background: #003fcc;
}

.login-box .forgot {
    text-align: center;
    margin-top: 10px;
    font-size: 0.9rem;
}
</style>
</head>

<body>
    <div class="login-box">
        <h2>MSC Portal Login</h2>

        <label>Benutzerkennung</label>
        <input type="text" placeholder="z.B. admin.maximan">

        <label>Passwort</label>
        <input type="password" placeholder="••••••••">

        <button>Anmelden</button>

        <div class="forgot">Passwort vergessen?</div>
    </div>
</body>
</html>
