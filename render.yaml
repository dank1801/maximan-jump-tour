databases:
  - name: maximan-jump-tour-db
    plan: free

services:
  - type: web
    name: maximan-jump-tour-portal
    env: docker
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: maximan-jump-tour-db
          property: connectionString
      - key: ENABLE_ONLINE_SNAPSHOT
        value: "true"
      - key: DB_DIR
        value: /var/data
      - key: REQUIRE_PERSISTENT_DB
        value: "false"
      - key: RENDER_DISK_MOUNT_PATH
        value: /var/data
    disk:
      name: msc-portal-data
      mountPath: /var/data
      sizeGB: 1
